name: Publish to npm

on:
  release:
    types: [published]   # GitHub Release 발행 시 배포 (태그 push 트리거로 바꿔도 됩니다)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # OIDC 인증 + provenance에 필수
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # Trusted Publishing은 npm 11.5.1+ 필요
      - run: npm ci
      - run: npm run build
      - run: npm publish